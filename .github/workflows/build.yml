name: Build and test DJX Exhibition
on:
  push:
    branches:
      - main
      - 'verify/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run automated tests and produce Windows-ready renderer and Electron bundles
        run: npm run check
      - name: Verify launch bundles
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist-electron/electron/main.js
          test -d dist/assets
      - name: Publish verified build outputs
        uses: actions/upload-artifact@v4
        with:
          name: djx-exhibition-verified-build
          path: |
            dist/
            dist-electron/
            launch.cmd
            Launch Mughal Times.cmd
          retention-days: 14
