<title>Mughal Times · A Legacy in Stone</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a2517;--gold:#d9b779;--ink:#f4ead6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:'Jost',system-ui,sans-serif;color:var(--ink)}
#root,#app{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 70%,#4a3f26 0%,#2a2517 60%,#1b170d 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 70% at 50% 55%,transparent 55%,rgba(0,0,0,.55))}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 55%,#fff4d6,#f0b45f 55%,#7a4a1c)}
.ui{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 4.5vh) 24px 0}
.ui>*{transition:opacity 1.2s ease,transform 1.2s ease;opacity:0;transform:translateY(8px)}
.brand{font-size:10px;letter-spacing:.42em;color:var(--gold)}
.chap{font-size:9px;letter-spacing:.34em;color:#b99d6b;margin-top:2.2vh;text-transform:uppercase}
h1{font:400 clamp(34px,7vh,58px)/1.05 'Cormorant Garamond',serif;margin:1.4vh 0 0;letter-spacing:.01em}
.rule{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:1.8vh 0}
.sub{font:italic 400 15px/1.5 'Cormorant Garamond',serif;color:#cdbf9f;max-width:300px}
.body{font-size:12.5px;font-weight:300;line-height:1.75;max-width:330px;margin-top:2vh;color:#eadfc6}
.show{opacity:1!important;transform:none!important}
.btn{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 3.2vh);translate:-50% 0;pointer-events:auto;cursor:pointer;border:1px solid rgba(217,183,121,.6);background:rgba(30,24,12,.55);backdrop-filter:blur(8px);color:var(--ink);font:400 11px 'Jost',sans-serif;letter-spacing:.3em;text-transform:uppercase;padding:14px 26px;border-radius:40px;transition:opacity 1s,background .3s;opacity:0}
.btn.show{animation:pulse 2.4s ease-in-out infinite}
.btn:hover{background:rgba(217,183,121,.25)}
.btn.off{pointer-events:none}
@keyframes pulse{50%{box-shadow:0 0 22px rgba(240,180,95,.55)}}

      for(let i=0;i<N;i++){let y=pp[i*3+1]+sp[i]*dt;if(y>8)y=-1;pp[i*3+1]=y;pp[i*3]+=Math.sin(tm+i)*.0015}

      fl.style.opacity=Math.sin(Math.PI*clamp((e-.3)/.5))*.6;
      R.render(sc,cam)};
    loop();
    P('rise');tw(2.6,t=>S.arch=t,E.back).then(()=>{if(!dead)P('idle')});
  });
  return api;
}

function App(){
  const [ph,setPh]=useState('load'),cv=useRef(),fl=useRef(),api=useRef();
  useEffect(()=>{api.current=init(cv.current,fl.current,setPh);return()=>api.current.dispose()},[]);
  const on=(c,k)=>c+(k?' show':'');
  const titled=!['load','rise'].includes(ph),inside=ph==='inside';
  return h('div',{id:'app',onClick:()=>ph==='idle'&&api.current.enter()},
    h('canvas',{ref:cv}),h('div',{className:'vig'}),
    h('div',{className:'ui'},
      h('div',{className:on('brand',titled)},'MUGHAL TIMES'),
      h('div',{className:on('chap',titled),style:{transitionDelay:'.15s'}},'Chapter 03 · Beyond the Arches'),
      h('h1',{className:on('',titled),style:{transitionDelay:'.3s'}},'A Legacy in Stone'),
      h('div',{className:on('rule',titled),style:{transitionDelay:'.45s'}}),
      h('div',{className:on('sub',titled),style:{transitionDelay:'.6s'}},'A legacy carved in marble, a grandeur that time could never erase.'),
      h('div',{className:on('body',inside),style:{transitionDelay:inside?'.6s':'0s'}},'Cut from a single slab of sandstone, the jali turns harsh sun into patterned light. It symbolised grace and privacy in Mughal courts, and today its geometry lives on in festive and modern Indian design.')),
    h('button',{className:on('btn',ph==='idle'),onClick:e=>{e.stopPropagation();api.current.enter()}},'Push the doors'),
    h('button',{className:on('btn',inside)+(inside?'':' off'),onClick:e=>{e.stopPropagation();api.current.leave()}},'Step back'),
    h('div',{id:'flash',ref:fl}));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
